<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaiESM1 多解析度實驗資料總覽</title>
<style>
  :root{
    --bg:#f3f8f4; --panel:#ffffff; --ink:#203025; --sub:#5e6f64;
    --line:#dfeae2; --accent:#2f8f5b; --accent-soft:#dcf0e2;
    --chip:#e8f4eb; --chip-ink:#245c3c; --mono:#3f5c4d;
    --shadow: 0 1px 2px rgba(21,74,45,0.05), 0 4px 14px rgba(21,74,45,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55;
  }
  header{
    padding: 24px 24px 18px; max-width:1180px; margin:0 auto;
  }
  .hero-banner{
    width:100%; height:260px; border-radius:16px; margin-bottom:18px;
    background-size:cover; background-position:center 30%; background-repeat:no-repeat;
    box-shadow:var(--shadow); border:1px solid var(--line);
  }
  @media (max-width:620px){
    .hero-banner{ height:150px; border-radius:12px; }
  }
  .brand-bar{
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .brand-left{ display:flex; align-items:center; gap:16px; min-width:0; }
  .brand-text h1{ font-size:1.55rem; margin:0 0 6px; font-weight:700; letter-spacing:.2px;}
  .brand-text p{ margin:0; color:var(--sub); font-size:.95rem; }
  .brand-logo{ display:block; object-fit:contain; }
  .brand-logo.ac3{ height:56px; width:56px; border-radius:10px; flex-shrink:0; }
  .brand-right{ display:flex; align-items:center; gap:18px; flex-shrink:0; }
  .brand-logo.cmip{ height:42px; }
  .brand-logo.wcrp{ height:42px; }
  @media (max-width:620px){
    .brand-right{ order:3; width:100%; justify-content:flex-start; margin-top:6px; }
  }
  .tabs{
    display:flex; gap:8px; max-width:1180px; margin: 8px auto 0; padding: 0 24px;
  }
  .tab-btn{
    border:1px solid var(--line); background:var(--panel); color:var(--sub);
    padding:9px 16px; border-radius:10px 10px 0 0; font-size:.92rem; cursor:pointer;
    font-weight:600; border-bottom:none; transform:translateY(1px);
  }
  .tab-btn.active{ color:var(--accent); background:var(--panel); border-color:var(--line);
    box-shadow: 0 -2px 0 var(--accent) inset; }
  main{
    max-width:1180px; margin:0 auto 60px; padding: 0 24px;
  }
  .card-frame{
    background:var(--panel); border:1px solid var(--line); border-radius:0 12px 12px 12px;
    box-shadow:var(--shadow); min-height:520px; overflow:hidden;
  }
  .view{ display:none; }
  .view.active{ display:flex; }

  /* ---- experiment view ---- */
  #view-exp{ }
  .exp-list{
    width: 300px; flex-shrink:0; border-right:1px solid var(--line); padding:14px;
    display:flex; flex-direction:column; gap:8px; background:#f2f8f3;
  }
  .exp-item{
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer;
    background:var(--panel); transition:.12s;
  }
  .exp-item:hover{ border-color:#bfe0cb; }
  .exp-item.active{ border-color:var(--accent); background:var(--accent-soft); }
  .exp-item .name{ font-weight:700; font-size:.98rem; margin-bottom:3px; }
  .exp-item .sub{ font-size:.78rem; color:var(--sub); }
  .exp-detail{ flex:1; padding: 20px 26px; overflow:auto; }
  .exp-head h2{ margin:0 0 4px; font-size:1.25rem; }
  .exp-head .meta-row{ display:flex; gap:22px; margin:10px 0 4px; flex-wrap:wrap; }
  .meta-box{ background:var(--chip); border-radius:8px; padding:8px 12px; font-size:.83rem; color:var(--chip-ink); }
  .meta-box b{ display:block; font-size:.72rem; font-weight:600; opacity:.65; margin-bottom:2px; }
  .exp-head .desc{ color:var(--sub); font-size:.88rem; margin-top:8px; }

  .freq-block{ margin-top: 22px; border-top:1px dashed var(--line); padding-top:14px; }
  .freq-title{
    font-size:.92rem; font-weight:700; margin-bottom:10px; cursor:pointer;
    display:flex; align-items:center; gap:8px; user-select:none;
  }
  .freq-title .count{ font-weight:500; color:var(--sub); font-size:.78rem; }
  .freq-title .arrow{ transition:.15s; color:var(--accent); font-size:.75rem; }
  .freq-title.collapsed .arrow{ transform:rotate(-90deg); }
  .var-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:8px;
    margin-bottom:6px;
  }
  .freq-title.collapsed + .var-grid{ display:none; }
  .var-card{
    border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:#fafdfb;
  }
  .var-card .vname{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight:700; font-size:.82rem; color:var(--ink); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .var-card .vlong{ font-size:.8rem; color:var(--ink); font-weight:600; margin:3px 0 1px; }
  .var-card .vdesc{ font-size:.76rem; color:var(--sub); margin:1px 0 5px; }
  .unit-badge{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight:600;
    font-size:.68rem; color:#245c3c; background:#dcf0e2; border-radius:5px; padding:1px 6px;
  }
  .var-card .vtime{ font-size:.72rem; color:var(--mono); background:var(--chip); display:inline-block; padding:2px 7px; border-radius:6px; margin:1px 3px 1px 0; }

  /* ---- variable view ---- */
  #view-var{ }
  .var-list-pane{
    width: 320px; flex-shrink:0; border-right:1px solid var(--line); background:#f2f8f3;
    display:flex; flex-direction:column;
  }
  .search-box{ padding:14px; border-bottom:1px solid var(--line); }
  .search-box input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:.88rem;
    outline:none; background:var(--panel);
  }
  .search-box input:focus{ border-color:var(--accent); }
  .var-scroll{ overflow:auto; padding:8px; flex:1; }
  .var-list-item{
    padding:9px 12px; border-radius:8px; cursor:pointer; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:.83rem; display:flex; justify-content:space-between; gap:8px; align-items:baseline;
  }
  .var-list-item:hover{ background:var(--chip); }
  .var-list-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .var-list-item .vd{ font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; font-size:.74rem; color:var(--sub); font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .var-detail{ flex:1; padding:22px 26px; overflow:auto; }
  .var-detail h2{ margin:0 0 2px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:1.3rem;}
  .var-detail h2{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .var-detail .vlong-full{ color:var(--ink); font-size:1rem; font-weight:600; margin:2px 0 4px; }
  .var-detail .vdesc-full{ color:var(--sub); font-size:.9rem; margin-bottom:18px; }
  .exp-hit{
    border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:10px;
    background:#fafdfb;
  }
  .exp-hit .eh-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:6px;}
  .exp-hit .eh-name{ font-weight:700; font-size:.95rem; }
  .exp-hit .eh-res{ font-size:.76rem; color:var(--sub); }
  .freq-tag{ display:inline-block; background:var(--chip); color:var(--chip-ink); font-size:.72rem; padding:3px 8px; border-radius:6px; margin:2px 4px 2px 0; font-weight:600;}
  .time-tag{ display:inline-block; font-size:.72rem; color:var(--mono); background:#e8f4eb; padding:2px 7px; border-radius:6px; margin:1px 3px 1px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
  .no-hit{ color:var(--sub); font-size:.85rem; }
  .file-row{ margin: 3px 0 6px; }
  .vpath{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:.7rem; color:var(--mono); background:#f2f8f3; border:1px solid var(--line);
    border-radius:5px; padding:4px 7px; margin-top:2px; word-break:break-all; line-height:1.4;
  }
  .empty-hint{ padding:60px 20px; text-align:center; color:var(--sub); font-size:.9rem; }

  .footnote{ max-width:1180px; margin: 18px auto 0; padding:0 24px; color:var(--sub); font-size:.78rem; }

  @media (max-width: 760px){
    .view.active{ flex-direction:column; }
    .exp-list, .var-list-pane{ width:100%; border-right:none; border-bottom:1px solid var(--line); max-height:220px; }
  }
</style>
</head>

 m-2 s-1"}, "rGrowth": {"desc": "生長呼吸通量", "long_name": "Total Autotrophic Respiration on Land as Carbon Mass Flux [kgC m-2 s-1]", "units": "kg m-2 s-1"}, "rMaint": {"desc": "維持呼吸通量", "long_name": "Carbon Mass Flux into Atmosphere Due to Maintenance Autotrophic Respiration on Land [kgC m-2 s-1]", "units": "kg m-2 s-1"}, "ra": {"desc": "自營呼吸通量", "long_name": "Carbon Mass Flux into Atmosphere Due to Autotrophic (Plant) Respiration on Land [kgC m-2 s-1]", "units": "kg m-2 s-1"}, "rh": {"desc": "異營呼吸通量", "long_name": "Total Heterotrophic Respiration on Land as Carbon Mass Flux [kgC m-2 s-1]", "units": "kg m-2 s-1"}, "tran": {"desc": "植被蒸散量", "long_name": "Transpiration", "units": "kg m-2 s-1"}, "tsl": {"desc": "土壤溫度(分層)", "long_name": "Temperature of Soil", "units": "K"}, "sfdsi": {"desc": "海冰鹽通量", "long_name": "Downward Sea Ice Basal Salt Flux", "units": "kg m-2 s-1"}, "siconc": {"desc": "海冰密集度", "long_name": "Sea-Ice Area Percentage (Ocean Grid)", "units": "%"}, "sidivvel": {"desc": "海冰散度速度", "long_name": "Divergence of the Sea-Ice Velocity Field", "units": "s-1"}, "sidmassgrowthbot": {"desc": "底部生長海冰質量通量", "long_name": "Sea-Ice Mass Change Through Basal Growth", "units": "kg m-2 s-1"}, "sidmassgrowthwat": {"desc": "開水面結冰質量通量", "long_name": "Sea-Ice Mass Change Through Growth in Supercooled Open Water (Frazil)", "units": "kg m-2 s-1"}, "sidmassmeltbot": {"desc": "底部融冰質量通量", "long_name": "Sea-Ice Mass Change Through Bottom Melting", "units": "kg m-2 s-1"}, "sidmassmelttop": {"desc": "表面融冰質量通量", "long_name": "Sea-Ice Mass Change Through Surface Melting", "units": "kg m-2 s-1"}, "sisnthick": {"desc": "海冰上積雪厚度", "long_name": "Snow Thickness", "units": "m"}, "sithick": {"desc": "海冰厚度", "long_name": "Sea Ice Thickness", "units": "m"}, "sitimefrac": {"desc": "海冰覆蓋時間比例", "long_name": "Fraction of Time Steps with Sea Ice", "units": "1"}, "sivol": {"desc": "海冰體積", "long_name": "Sea-Ice Volume per Area", "units": "m"}, "sivoln": {"desc": "北半球海冰體積", "long_name": "Sea-Ice Volume North", "units": "1e3 km3"}, "sivols": {"desc": "南半球海冰體積", "long_name": "Sea-Ice Volume South", "units": "1e3 km3"}, "sndmassmelt": {"desc": "積雪融化質量通量", "long_name": "Snow Mass Rate of Change Through Melt", "units": "kg m-2 s-1"}, "bldep": {"desc": "邊界層深度", "long_name": "Boundary Layer Depth", "units": "m"}, "lwp": {"desc": "液態水路徑", "long_name": "Liquid Water Path", "units": "kg m-2"}, "od440aer": {"desc": "440nm氣膠光學厚度", "long_name": "Ambient Aerosol Optical Thickness at 440nm", "units": "1"}, "od550aer": {"desc": "550nm氣膠光學厚度", "long_name": "Ambient Aerosol Optical Thickness at 550nm", "units": "1"}, "od550dust": {"desc": "550nm沙塵氣膠光學厚度", "long_name": "Dust Optical Thickness at 550nm", "units": "1"}}, "freqLabel": {"Amon": "月平均 (大氣, Amon)", "day": "日平均 (day)", "Emon": "月平均 (陸地碳氮循環, Emon)", "AERmon": "月平均 (氣膠, AERmon)", "LImon": "月平均 (陸冰/積雪, LImon)", "Lmon": "月平均 (陸地, Lmon)", "SImon": "月平均 (海冰, SImon)", "fx": "固定場 (fx, 不隨時間變化)"}, "expOrder": ["TaiESM1-HA", "TaiESM1-LALO", "TaiESM1-MALO", "TaiESM1-HALO", "TaiESM1-HAHO-L42", "TaiESM1-HAHO-L62"]};

const expOrder = DATA.expOrder;
const freqLabel = DATA.freqLabel;
const freqOrder = ["Amon","day","AERmon","Emon","Lmon","LImon","SImon","fx"];

function sortFreqs(freqs){
  return Object.keys(freqs).sort((a,b)=>{
    let ia = freqOrder.indexOf(a), ib = freqOrder.indexOf(b);
    if(ia<0) ia = 99; if(ib<0) ib = 99;
    return ia-ib;
  });
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
  });
});

/* ---------------- Experiment view ---------------- */
const expListEl = document.getElementById('expList');
const expDetailEl = document.getElementById('expDetail');

expOrder.forEach(expName=>{
  if(!DATA.experiments[expName]) return;
  const info = DATA.experiments[expName].info;
  const div = document.createElement('div');
  div.className = 'exp-item';
  div.dataset.exp = expName;
  div.innerHTML = `<div class="name">${info.name}</div><div class="sub">${info.desc}</div>`;
  div.addEventListener('click', ()=> selectExp(expName));
  expListEl.appendChild(div);
});

function selectExp(expName){
  document.querySelectorAll('.exp-item').forEach(e=>e.classList.toggle('active', e.dataset.exp===expName));
  const exp = DATA.experiments[expName];
  const info = exp.info;
  let html = `
    <div class="exp-head">
      <h2>${info.name}</h2>
      <div class="desc">${info.desc}</div>
      <div class="meta-row">
        <div class="meta-box"><b>大氣解析度</b>${info.atmos||'—'}</div>
        <div class="meta-box"><b>海洋解析度</b>${info.ocean||'—'}</div>
        <div class="meta-box"><b>排放設定</b>固定於 2000 年 (control-2000)</div>
      </div>
    </div>`;

  const freqs = sortFreqs(exp.freqs);
  freqs.forEach(freq=>{
    const vars = exp.freqs[freq];
    const varNames = Object.keys(vars).sort();
    html += `<div class="freq-block">
      <div class="freq-title" data-freq="${expName}__${freq}">
        <span class="arrow">▾</span> ${freqLabel[freq]||freq}
        <span class="count">（${varNames.length} 個變數）</span>
      </div>
      <div class="var-grid">`;
    varNames.forEach(v=>{
      const info2 = vars[v];
      let rows = '';
      info2.files.forEach(f=>{
        const t = f.time || '固定場・無時間軸';
        rows += `<div class="file-row"><span class="vtime">${t}</span><div class="vpath">${f.path}</div></div>`;
      });
      const unitBadge = info2.units ? `<span class="unit-badge">${info2.units}</span>` : '';
      html += `<div class="var-card">
        <div class="vname">${v} ${unitBadge}</div>
        <div class="vlong">${info2.long_name || ''}</div>
        <div class="vdesc">${info2.desc}</div>
        ${rows}
      </div>`;
    });
    html += `</div></div>`;
  });

  expDetailEl.innerHTML = html;
  expDetailEl.scrollTop = 0;

  document.querySelectorAll('.freq-title').forEach(ft=>{
    ft.addEventListener('click', ()=> ft.classList.toggle('collapsed'));
  });
}

/* ---------------- Variable view ---------------- */
const varListScroll = document.getElementById('varListScroll');
const varDetailEl = document.getElementById('varDetail');
const varSearch = document.getElementById('varSearch');

const allVarNames = Object.keys(DATA.variables).sort();

function renderVarList(filter){
  const f = (filter||'').trim().toLowerCase();
  varListScroll.innerHTML = '';
  allVarNames.forEach(v=>{
    const meta = DATA.variables[v];
    const searchable = `${v} ${meta.desc||''} ${meta.long_name||''}`.toLowerCase();
    if(f && !searchable.includes(f)) return;
    const item = document.createElement('div');
    item.className = 'var-list-item';
    item.dataset.var = v;
    item.innerHTML = `<span>${v}</span><span class="vd">${meta.long_name || meta.desc}</span>`;
    item.addEventListener('click', ()=> selectVar(v));
    varListScroll.appendChild(item);
  });
}
renderVarList('');
varSearch.addEventListener('input', e=> renderVarList(e.target.value));

function selectVar(varName){
  document.querySelectorAll('.var-list-item').forEach(e=>e.classList.toggle('active', e.dataset.var===varName));
  const meta = DATA.variables[varName];
  const unitBadge = meta.units ? `<span class="unit-badge">${meta.units}</span>` : '';
  let html = `<h2>${varName} ${unitBadge}</h2>
    <div class="vlong-full">${meta.long_name || ''}</div>
    <div class="vdesc-full">${meta.desc || ''}</div>`;

  let hitCount = 0;
  expOrder.forEach(expName=>{
    const exp = DATA.experiments[expName];
    if(!exp) return;
    const info = exp.info;
    const freqs = sortFreqs(exp.freqs);
    const hitsInExp = [];
    freqs.forEach(freq=>{
      if(exp.freqs[freq][varName]){
        hitsInExp.push({freq, data: exp.freqs[freq][varName]});
      }
    });
    if(hitsInExp.length===0) return;
    hitCount++;
    html += `<div class="exp-hit">
      <div class="eh-top">
        <span class="eh-name">${info.name}</span>
        <span class="eh-res">${info.atmos||'—'} ／ ${info.ocean||'—'}</span>
      </div>
      <div>`;
    hitsInExp.forEach(h=>{
      html += `<div style="margin-bottom:10px;"><span class="freq-tag">${freqLabel[h.freq]||h.freq}</span>`;
      h.data.files.forEach(f=>{
        const t = f.time || '固定場・無時間軸';
        html += `<div class="file-row"><span class="time-tag">${t}</span><div class="vpath">${f.path}</div></div>`;
      });
      html += `</div>`;
    });
    html += `</div></div>`;
  });

  if(hitCount===0){
    html += `<div class="no-hit">沒有找到擁有此變數的實驗。</div>`;
  }

  varDetailEl.innerHTML = html;
  varDetailEl.scrollTop = 0;
}

/* auto-select first experiment on load */
if(expOrder.length){ selectExp(expOrder.find(e=>DATA.experiments[e])); }
</script>
